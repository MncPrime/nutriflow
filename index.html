<style>
:root{--bg:#F4F7F5;--card:#fff;--ink:#14201B;--mut:#5C6B64;--line:#DCE5E0;--pri:#1B7F5C;--onpri:#fff;--acc:#C77A0A;--bad:#B3261E;--ok:#1B7F5C}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1512;--card:#17211C;--ink:#E8F0EC;--mut:#93A59C;--line:#26342D;--pri:#4CC38F;--onpri:#06150E;--acc:#F0B34F;--bad:#FF8A80;--ok:#4CC38F}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}

h2{font-size:18px;margin:0 0 4px}
p.h{color:var(--mut);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}

textarea{min-height:170px;resize:vertical}
button.p,button.s{font:inherit;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;border:1px solid var(--pri)}
button.p{background:var(--pri);color:var(--onpri);font-weight:700}
button.s{background:none;color:var(--pri)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.it{display:grid;grid-template-columns:auto 1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}

.it small{display:block;color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:12px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;min-height:44px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}

.sec{color:var(--pri);font-weight:700;margin:16px 0 6px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}

.ln div:last-child{text-align:right;white-space:nowrap}
.warn{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line)}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;min-height:40px;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--bg))}.chip[aria-pressed=false]{opacity:.55;text-decoration:line-through}.oh{display:block;font-weight:700;margin-top:10px}.pi{width:84px;padding:4px 6px;margin-top:4px;text-align:right}details summary{cursor:pointer;color:var(--pri);margin:8px 0;min-height:32px}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0}.mh label,.oh{display:flex;align-items:center;gap:8px}header .row>*{flex:none}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
.net{font-size:12px;color:var(--mut)}
#th{display:grid;place-items:center;padding:0}
.plan-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.plan-heading h2{font-size:22px;margin:0}
.plan-count{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--mut);font-size:12px}
.plan-description{font-size:14px;color:var(--mut);margin:0 0 16px}
.plan-meals{display:grid;gap:10px}
.plan-meal{padding:14px;margin:0;border-radius:14px}
.plan-meal-head{padding-bottom:10px;border-bottom:1px solid var(--line);margin:0}
.plan-meal-toggle{font-weight:700;min-width:0}
.plan-meal-toggle input{width:24px;height:24px}
.plan-meal-name{font-size:17px;line-height:1.25}
.plan-time{flex:none;border-radius:999px;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri);padding:4px 9px;font-size:12px;font-weight:600}
.plan-meal .oh{margin:10px 0 0;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:13px}
.plan-meal .oh input{width:20px;height:20px}
.plan-meal-head + .chips{border-top:0;padding-top:10px}
.admin-form{display:grid;gap:10px}
.admin-form label{display:grid;gap:4px;font-size:13px;font-weight:600}
.admin-form label:has(input[type=checkbox]){display:block}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.admin-food:first-child{border-top:0}
.admin-food small{display:block;color:var(--mut)}
.admin-food button{min-height:44px}
.sync-error{border:1px solid var(--bad);border-radius:10px;padding:10px;margin-bottom:12px;color:var(--bad)}
.quote-status{color:var(--mut);font-size:14px}
.quote-pending{display:block;color:var(--bad);font-size:12px}
.quote-breakdown{display:grid;gap:8px}.quote-breakdown div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:4px 0}.quote-breakdown span{color:var(--mut)}
@media(max-width:420px){.plan-meal{padding:12px}.plan-heading h2{font-size:20px}.plan-meal-name{font-size:16px}.chip{font-size:12px;padding:7px 10px;min-height:38px}}
</style>
</head>
<body>
<header><h1 class="font-bold">Nutri<span>Flow</span></h1><div class="row" style="flex:0"><span class="net" id="net"></span><button class="s" id="sync" style="min-width:44px;padding:0" aria-label="Sincronizar catálogo" title="Sincronizar catálogo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.64 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.36-3"/></svg></button><button class="s" id="admin" style="min-width:44px;padding:0" aria-label="Área do administrador" title="Área do administrador"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0M19 8h3m-1.5-1.5v3"/></svg></button><button class="s" id="th" style="min-width:44px;padding:0" aria-label="Alternar tema"></button></div></header>
<main id="m"></main>
<nav id="nav"></nav>
<script type="module">
import {

  saveQuoteSnapshot,
} from './src/data/local-db.js';
const $=s=>document.querySelector(s);
const DEF=`# Café da manhã | 06:00
1 un banana ou 150g mamão papaia
10g farelo de aveia
2 fatias pão de forma integral ou 1 un pão francês
40g queijo minas frescal ou 30g mussarela

# Lanche da manhã | 10:00
## Opção 1

## Opção 2

30g leite em pó

# Almoço | 12:00
90g arroz integral cozido ou arroz branco cozido ou aipim cozido ou inhame cozido ou 190g batata inglesa cozida ou 230g abóbora cabotiã cozida ou 80g macarrão cozido
100g feijão cozido
150g filé de frango grelhado ou 130g carne patinho moída ou 3 un ovo cozido ou 200g peixe grelhado
110g cenoura ou beterraba ou vagem ou brócolis ou couve-flor ou chuchu ou abobrinha ou tomate ou pepino

# Lanche da tarde | 15:00
## Opção 1
170g iogurte (cenoura, mel e laranja)

## Opção 2
30g whey protein concentrado

## Opção 3

# Jantar | 19:00

70g feijão cozido

const KW=[['ovo',/\bovos?\b/i],['supl',/whey|leite em p/i],['arroz',/arroz/i],['feijao',/feij[aã]o|lentilha/i],['mac',/macarr|massa|espaguete/i],['tub',/batata|ab[oó]bora|aipim|mandioca|inhame|cabotia/i],['prot',/frango|carne|patinho|peixe|til[aá]pia|bife|merluza|salm[aã]o|ac[eé]m/i]];
const cat=n=>(KW.find(k=>k[1].test(n))||['out'])[0];
import { sanitizeFoodName } from './src/utils/food-matching.js';
let S;try{S=JSON.parse(localStorage.getItem('nf2')||'null')}catch(e){}
S=Object.assign({text:DEF,days:14,mode:'var',budget:0,tab:0,theme:'',off:{},moff:{},prices:{},priceOverrides:{},customerName:''},S||{});
let tab=Number.isInteger(S.tab)&&S.tab>=0&&S.tab<=4?S.tab:0,P,catalogSnapshot=null,adminSession=null,adminData=null,adminFoodEdit=null,newFoodDraft=null,adminAuthMode='login',adminAuthMessage='',screenError='',planError='',isSyncing=false,quoteHistory=[],adminPending=[],lastQuoteLink='',liveQuote=null,liveQuoteKey='',quoteRequestInFlight='',quoteErrorKey='',offlineSnapshot=null,offlineSnapshotKey='',offlineLookupKey='',adminRequests=[];
S.tab=tab;
function quoteKeyForState(state=S){return JSON.stringify({text:state.text,days:state.days,mode:state.mode,off:state.off,moff:state.moff})}
let activeQuoteKey=quoteKeyForState();
const save=()=>{S.tab=tab;const nextKey=quoteKeyForState();if(nextKey!==activeQuoteKey){activeQuoteKey=nextKey;liveQuote=null;liveQuoteKey='';offlineSnapshot=null;offlineSnapshotKey='';quoteErrorKey='';lastQuoteLink=''}try{localStorage.setItem('nf2',JSON.stringify(S))}catch(e){}};
const fmtMoney=(value,currency=catalogSnapshot?.config?.currency||'BRL')=>new Intl.NumberFormat('pt-BR',{style:'currency',currency}).format(value);
const hasPrice=value=>value!==undefined&&value!==null&&value!==''&&Number.isFinite(Number(value));
const num=s=>{s=s.replace(',','.');if(s.includes('/')){const[a,b]=s.split('/');return a/b}return parseFloat(s)};
const themeIcon=dark=>dark
  ?'<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
  :'<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397Z"/></svg>';
function parseAlt(p,prev){
  const m=p.trim().match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)\s*(kg|g|ml|un|und|unid\w*|fatias?)?\s+(.*)$/i);
  if(m){let q=num(m[1]),u=(m[2]||'un').toLowerCase();if(u==='kg'){q*=1000;u='g'}const g=u==='g'?q:0,ml=u==='ml'?q:0;return{name:m[3].trim(),g,ml,n:g||ml?0:q,cat:cat(m[3])}}
  return prev?{name:p.trim(),g:prev.g,ml:prev.ml||0,n:prev.n,cat:cat(p)}:null;
}
function parsePlan(t){
  const ms=[];let m,o;
  for(const raw of t.split('\n')){
    const l=raw.trim();if(!l)continue;
    if(l[0]==='#'&&l[1]!=='#'){const[n,h]=l.slice(1).split('|');m={name:n.trim(),time:(h||'').trim(),opts:[]};ms.push(m);o=null;continue}
    if(l.startsWith('##')&&m){o={name:l.slice(2).trim(),comps:[]};m.opts.push(o);continue}
    if(!m||!/\d/.test(l))continue;
    if(!o){o={name:'',comps:[]};m.opts.push(o)}
    let prev=null;const alts=[];
    for(const p of l.split(/\s+ou\s+/i)){const a=parseAlt(p,prev);if(a){alts.push(a);prev=a}}
    if(alts.length)o.comps.push({alts});
  }
  return ms;
}
const sector=it=>it.cat==='supl'?'Suplementos':it.cat==='prot'?'Açougue':it.cat==='ovo'||/queijo|mussarela|iogurte|leite/i.test(it.name)?'Laticínios e ovos':/p[aã]o/i.test(it.name)?'Padaria':it.cat==='tub'||/banana|ma[cç][aã]|pera|manga|mam[aã]o|abacaxi|tangerina|laranja|lim[aã]o|kiwi|cenoura|beterraba|vagem|br[oó]colis|couve|chuchu|abobrinha|tomate|pepino/i.test(it.name)?'Hortifrúti':'Mercearia';
function plan(){
  const key=quoteKeyForState();
  const quote=liveQuoteKey===key
    ?{...liveQuote,offline:!navigator.onLine}
    :offlineSnapshotKey===key
      ?offlineSnapshot
      :calculateCommercialQuote(P,S,catalogSnapshot||{foods:[],aliases:[],config:null,pricesProtected:true,unavailable:true});
  const lines=quote.lines.map(line=>({...line,cat:line.category,mode:line.baseUnit==='unit'?'n':line.baseUnit,q:line.rawAmount,c:line.prescribedAmount,buy:line.purchaseAmount,p:line.unitPrice,cost:line.cost,sec:sector({name:line.name,cat:line.category})}));
  const out=quote.meals.map(meal=>({m:meal,isM:meal.isMarmita,list:meal.selections}));
  return{N:quote.marmitaCount,out,lines,total:quote.foodCost??quote.knownFoodCost,marm:quote.productionCost,quote};
}
const esc=s=>String(s??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function reportError(error){screenError=error instanceof Error?error.message:String(error);view()}
function quoteFromSnapshot(snapshot){
  return{...snapshot,meals:snapshot.selectedMeals,offline:true,syncedAt:snapshot.syncedAt||snapshot.createdAt};
}
function loadOfflineQuote(key){
  if(offlineLookupKey===key||offlineSnapshotKey===key)return;
  offlineLookupKey=key;
  getCachedQuoteSnapshot(key).then(snapshot=>{
    if(key!==quoteKeyForState()||navigator.onLine)return;
    if(snapshot){offlineSnapshot=quoteFromSnapshot(snapshot);offlineSnapshotKey=key;view()}
  }).catch(reportError).finally(()=>{if(offlineLookupKey===key)offlineLookupKey=''});
}
function ensureOnlineQuote(){
  const key=quoteKeyForState();
  if(tab!==3)return;
  if(!navigator.onLine){loadOfflineQuote(key);return}
  if(!supabaseConfigured||liveQuoteKey===key||quoteRequestInFlight===key||quoteErrorKey===key)return;
  quoteRequestInFlight=key;
  requestCommercialQuote(P,S).then(quote=>{
    if(key!==quoteKeyForState())return;
    liveQuote=quote;liveQuoteKey=key;quoteErrorKey='';screenError='';view();
  }).catch(error=>{
    if(key===quoteKeyForState()){quoteErrorKey=key;reportError(error)}
  }).finally(()=>{if(quoteRequestInFlight===key)quoteRequestInFlight=''});
}
function renderAdmin(){
  if(!supabaseConfigured)return '<h2>Área administrativa</h2><p class="warn">Configure VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY para conectar ao catálogo.</p>';
  if(!adminSession&&adminAuthMode==='recovery')return `<h2>Redefinir senha</h2><p class="h">Escolha uma nova senha para sua conta de administrador.</p><form class="card admin-form" onsubmit="event.preventDefault();adminSaveRecoveryPassword()"><label>Nova senha<input id="admin-new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirme a nova senha<input id="admin-confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button class="p" type="submit">Salvar nova senha</button></form>`;
  if(!adminSession)return `<h2>Área administrativa</h2><p class="h">Entre com a conta de administrador do Supabase.</p>${adminAuthMessage?`<p class="quote-status" role="status">${esc(adminAuthMessage)}</p>`:''}<form class="card admin-form" onsubmit="event.preventDefault();adminLogin()"><label>E-mail<input id="admin-email" type="email" autocomplete="username" required></label><label>Senha<input id="admin-password" type="password" autocomplete="current-password" required></label><button class="p" type="submit">Entrar</button><button class="s" type="button" onclick="adminSendPasswordReset()">Esqueci minha senha</button></form>`;
  const config=adminData?.config||catalogSnapshot?.config||{};
  const foods=adminData?.foods||[];
  const aliases=adminData?.aliases||[];
  const editing=foods.find(food=>food.id===adminFoodEdit)||newFoodDraft||{};
  const statusLabels={approved:'Aprovado',pending:'Pendente',rejected:'Rejeitado'};
  const categories=[['prot','Proteína'],['arroz','Arroz'],['feijao','Feijão'],['tub','Tubérculo/legume'],['mac','Macarrão'],['ovo','Ovo'],['supl','Suplemento'],['out','Outros']];
  return `<div class="plan-heading"><h2>Área administrativa</h2><button class="s" onclick="adminLogout()">Sair</button></div>
    <form class="card admin-form" onsubmit="event.preventDefault();saveConfigFromForm()"><h3>Configurações comerciais</h3>
    <label>Nome do negócio<input id="cfg-business-name" value="${esc(config.business_name||'NutriFlow')}" required></label>
    <div class="row"><label>Moeda<input id="cfg-currency" value="${esc(config.currency||'BRL')}" maxlength="3" required></label><label>Markup (%)<input id="cfg-markup" type="number" min="0" step="0.01" value="${esc(config.markup_percent??0)}" required></label></div>
    <div class="row"><label>Taxa do app (%)<input id="cfg-fee" type="number" min="0" step="0.01" value="${esc(config.app_fee_percent??0)}" required></label><label>Embalagem por marmita<input id="cfg-packaging" type="number" min="0" step="0.01" value="${esc(config.packaging_cost_per_meal??0)}" required></label></div>
    <div class="row"><label>Confecção por marmita<input id="cfg-labor" type="number" min="0" step="0.01" value="${esc(config.labor_cost_per_meal??0)}" required></label><label>Overhead por marmita<input id="cfg-overhead" type="number" min="0" step="0.01" value="${esc(config.overhead_cost_per_meal??0)}" required></label></div>
    <label><input id="cfg-show-prices" type="checkbox" ${config.show_food_prices?'checked':''}> Exibir preço unitário dos alimentos ao cliente</label><button class="p" type="submit">Salvar configurações</button></form>

async function setFoodStatus(id,status){

  if(status==='approved'&&!hasPrice(food.price_per_purchase_unit)){reportError(new Error('Edite o alimento e informe um preço válido antes de aprová-lo.'));return}

    canonical_name:request.food_name,
    category:request.category,
    base_unit:request.base_unit,

    approval_status:'pending',

  view();
}

    return;
  }
  indicator.textContent=isSyncing?'Sincronizando catálogo…':'';
}
addEventListener('online',()=>{net();screenError='';syncCatalog()});
addEventListener('offline',()=>{screenError='';net();view()});
net();
if(navigator.onLine&&supabaseConfigured)syncCatalog();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
view();
</script>
