<style>

:root[data-theme=dark]{--bg:#0E1512;--card:#17211C;--ink:#E8F0EC;--mut:#93A59C;--line:#26342D;--pri:#4CC38F;--onpri:#06150E;--acc:#F0B34F;--bad:#FF8A80;--ok:#4CC38F}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.topbar-actions button{display:grid;place-items:center;width:48px;height:48px;min-width:48px;padding:0;border-radius:14px;border-color:transparent;background:transparent;color:var(--mut);transition:background-color .15s,color .15s,transform .15s}

.icon{display:block;width:20px;height:20px;flex:none}

.feedback{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;margin:0 0 12px;border:1px solid color-mix(in srgb,var(--ok) 28%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--ok) 9%,var(--card));color:var(--ok);font-size:14px;font-weight:600}
.feedback .icon{margin-top:1px}
.saving-icon{width:18px;height:18px;animation:save-spin .9s linear infinite}

p.h{color:var(--mut);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}

button.p,button.s{font:inherit;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;border:1px solid var(--pri)}
button.p{background:var(--pri);color:var(--onpri);font-weight:700}
button.s{background:none;color:var(--pri)}

.is-saving{display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.it input[type=checkbox]{width:22px;height:22px}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg button{padding:12px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;min-height:44px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
.cycle-options{display:grid;gap:12px}
.seg-preference{grid-template-columns:repeat(2,minmax(0,1fr))}
.cycle-budget{margin-top:16px}
.budget-status{margin:8px 0 0;font-size:14px;font-weight:700}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi small{color:var(--mut);display:block;font-size:12px}

.sec{color:var(--pri);font-weight:700;margin:16px 0 6px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ln small{color:var(--mut);display:block}
.ln div:last-child{text-align:right;white-space:nowrap}
.warn{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line)}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;min-height:44px;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--bg))}.chip[aria-pressed=false]{opacity:.55;text-decoration:line-through}.oh{display:block;font-weight:700;margin-top:10px}.pi{width:84px;padding:4px 6px;margin-top:4px;text-align:right}details summary{cursor:pointer;color:var(--pri);margin:8px 0;min-height:44px}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0}.mh label,.oh{display:flex;align-items:center;gap:8px}
.empty{text-align:center;color:var(--mut);padding:32px 8px}
.net{font-size:12px;color:var(--mut)}
#th{display:grid;place-items:center;padding:0}
.plan-editor{margin:0 0 12px;padding:12px}
.plan-editor summary{margin:0 0 8px}
.plan-editor textarea{margin:4px 0}
.plan-editor .row{margin-top:12px}
.plan-editor-hint{margin:0 0 12px;color:var(--mut);font-size:14px}
.capture-card{padding:14px}.capture-card h3{margin:0 0 4px;font-size:17px}.capture-card textarea{min-height:132px}.capture-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.capture-actions button{width:100%}.capture-guide{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.capture-guide h4{margin:0 0 8px;font-size:15px}.capture-guide .row{gap:8px}.capture-preview{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.capture-preview h4{margin:0 0 8px;font-size:15px}.capture-preview ul,.capture-warnings{margin:8px 0;padding-left:20px}.capture-preview li,.capture-warnings li{margin:4px 0}.capture-warnings{color:var(--bad);font-size:13px}.capture-source{font-size:13px;color:var(--mut);margin:0 0 10px}.capture-preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.capture-preview-actions button{padding-inline:10px}

.imp-primary{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));background:color-mix(in srgb,var(--pri) 5%,var(--bg))}
.imp-opt:disabled{opacity:.78;cursor:not-allowed}
.imp-ico{grid-column:1;grid-row:1 / span 2;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--pri) 11%,var(--card));color:var(--pri)}
.imp-ico svg{display:block;width:22px;height:22px;flex:none}
.imp-txt{grid-column:2;grid-row:1;display:grid;gap:2px;min-width:0}

.imp-txt small{color:var(--mut);font-size:12px;line-height:1.4}
.imp-tag,.imp-soon{grid-column:2;grid-row:2;justify-self:start;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--pri) 12%,var(--card));color:var(--pri);font-size:11px;font-style:normal;font-weight:700}
.imp-soon{background:var(--card);color:var(--mut)}
.imp-opt input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}
.capture-input{margin-bottom:12px}
.capture-label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:8px}
.upload-pdf{display:block;position:relative;cursor:pointer}
.upload-pdf input[type=file]{display:none}
.upload-pdf .upload-button{display:flex;align-items:center;justify-content:center;padding:14px;border:2px dashed var(--line);border-radius:10px;background:color-mix(in srgb,var(--pri) 5%,var(--bg));color:var(--pri);text-align:center;font-weight:600;font-size:15px;transition:background-color .15s,border-color .15s;min-height:54px}

.capture-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;color:var(--mut);font-size:14px}
.food-suggestions{display:flex;flex-direction:column;gap:4px;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.suggestion-item{display:block;width:100%;padding:10px;text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:14px;transition:background-color .15s;min-height:40px}
.suggestion-item:hover{background:color-mix(in srgb,var(--pri) 10%,var(--bg));color:var(--pri)}

.manual-intro{margin:0 0 14px;color:var(--mut);font-size:14px}
.manual-section{display:grid;gap:8px;margin:0 0 12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--pri) 3%,var(--card))}
.manual-section h4{margin:0 0 2px;font-size:15px;letter-spacing:-.01em}
.manual-section>label,.manual-quantity>label{font-size:13px;font-weight:650;color:var(--mut)}
.manual-section input,.manual-section select{min-height:48px;border-radius:12px;background:var(--bg)}
.manual-selected,.manual-help{margin:0;color:var(--mut);font-size:12px;line-height:1.45}
.manual-selected b{color:var(--ink)}
.manual-quantity{display:grid;gap:6px}
.manual-quantity-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(104px,.55fr);gap:8px}
.req{color:var(--bad,var(--mut))}
.manual-error{display:block;color:var(--bad,var(--mut));font-size:12px;margin-top:4px}
.manual-missing{margin-top:8px}
.manual-added{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:12px;border:1px solid var(--ok);border-radius:14px;background:color-mix(in srgb,var(--ok) 8%,var(--card));font-size:14px}

.manual-draft div{display:flex;gap:8px}.manual-draft button{min-height:44px;flex:1}

button[aria-disabled=true]{opacity:.55}
.manual-section .imp-cats .chip{background:var(--bg)}
.imp-understood{margin:12px 0;padding:12px;border:1px solid color-mix(in srgb,var(--pri) 24%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--pri) 6%,var(--card));font-size:13px}
.imp-understood>b{display:block;margin-bottom:6px;color:var(--pri)}
.imp-understood>div+div{margin-top:5px}
.imp-understood i{padding:0 4px;color:var(--mut);font-style:normal}
.capture-preview-actions .p:disabled{opacity:.5;cursor:not-allowed}
.plan-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.plan-heading h2{font-size:22px;margin:0}
.plan-count{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--mut);font-size:12px}
.plan-description{font-size:14px;color:var(--mut);margin:0 0 16px}
.plan-meals{display:grid;gap:12px}
.plan-meal{padding:14px;margin:0;border-radius:14px}
.plan-meal-head{padding-bottom:10px;border-bottom:1px solid var(--line);margin:0}
.plan-meal-toggle{font-weight:700;min-width:0}
.plan-meal-toggle input{width:24px;height:24px}
.plan-meal-name{font-size:17px;line-height:1.25}
.plan-time{flex:none;border-radius:999px;background:color-mix(in srgb,var(--pri) 10%,var(--card));color:var(--pri);padding:4px 9px;font-size:12px;font-weight:600}
.plan-meal .oh{margin:10px 0 0;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:13px}

.admin-form{display:grid;gap:10px}
.admin-form button[type=submit],#m>button.p{width:100%}

.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}

.admin-food small{display:block;color:var(--mut)}
.admin-food button{min-height:44px}
.sync-error{border:1px solid var(--bad);border-radius:10px;padding:10px;margin-bottom:12px;color:var(--bad)}

</style>

async function withSaving(button,message,action){

    await new Promise(resolve=>requestAnimationFrame(resolve));
    const startedAt=performance.now();
    await action();

    if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));

async function preparePdfEngine(){
  if(!navigator.onLine||!('serviceWorker'in navigator))return;
  try{
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      await new Promise(resolve=>{
        const timeout=setTimeout(resolve,3000);
        navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timeout);resolve()},{once:true});
      });
    }
    if(!navigator.serviceWorker.controller)throw new Error('Recarregue o app para preparar o leitor de PDF offline.');
    await preloadPdfEngine();
    imp.pdfError='';
  }catch(error){
    imp.pdfError=`Não foi possível preparar o leitor de PDF offline: ${error instanceof Error?error.message:String(error)}`;
  }
  if(tab===0&&imp.mode==='')view();
}
