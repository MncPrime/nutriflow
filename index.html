.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}

@media(max-width:420px){main{padding:14px}.plan-meal{padding:12px}.plan-heading h2{font-size:20px}.plan-meal-name{font-size:16px}.chip{font-size:12px;padding:8px 10px}}

</style>

<script type="module">

const $=s=>document.querySelector(s);
const DEF=`# Café da manhã | 06:00

# Almoço | 12:00
90g arroz integral cozido ou arroz branco cozido ou aipim cozido ou inhame cozido ou 190g batata inglesa cozida ou 230g abóbora cabotiã cozida ou 80g macarrão cozido
100g feijão cozido
150g filé de frango grelhado ou 130g carne patinho moída ou 3 un ovo cozido ou 200g peixe grelhado

# Lanche da tarde | 15:00
## Opção 1

## Opção 2

## Opção 3
60g pão francês ou 2 fatias pão de forma
30g mussarela ou 50g queijo minas
30g whey protein concentrado
# Jantar | 19:00
90g arroz integral cozido ou arroz branco cozido ou aipim cozido ou inhame cozido ou 190g batata inglesa cozida ou 230g abóbora cabotiã cozida ou 80g macarrão cozido
70g feijão cozido
100g filé de frango grelhado ou 100g carne patinho moída ou 2 un ovo cozido ou 130g peixe grelhado
110g cenoura ou beterraba ou vagem ou brócolis ou couve-flor ou chuchu ou abobrinha ou tomate ou pepino`;
const KW=[['ovo',/\bovos?\b/i],['supl',/whey|leite em p/i],['arroz',/arroz/i],['feijao',/feij[aã]o|lentilha/i],['mac',/macarr|massa|espaguete/i],['tub',/batata|ab[oó]bora|aipim|mandioca|inhame|cabotia/i],['prot',/frango|carne|patinho|peixe|til[aá]pia|bife|merluza|salm[aã]o|ac[eé]m/i]];
const cat=n=>(KW.find(k=>k[1].test(n))||['out'])[0];
import { sanitizeFoodName } from './src/utils/food-matching.js';
let S;try{S=JSON.parse(localStorage.getItem('nf2')||'null')}catch(e){}
S=Object.assign({text:DEF,days:14,mode:'var',budget:0,tab:0,theme:'',off:{},moff:{},prices:{},priceOverrides:{},customerName:''},S||{});
let tab=Number.isInteger(S.tab)&&S.tab>=0&&S.tab<=4?S.tab:0,P,catalogSnapshot=null,adminSession=null,adminData=null,adminFoodEdit=null,newFoodDraft=null,adminAuthMode='login',adminAuthMessage='',successMessage='',successTimer=0,planError='',screenError='',isSyncing=false,quoteHistory=[],adminPending=[],lastQuoteLink='',liveQuote=null,liveQuoteKey='',quoteRequestInFlight='',quoteErrorKey='',offlineSnapshot=null,offlineSnapshotKey='',offlineLookupKey='',adminRequests=[],captureText=S.text,capturePreview=null,captureFormOpen=false;
const savingActions=new Set();
S.tab=tab;
function quoteKeyForState(state=S){return JSON.stringify({text:state.text,days:state.days,mode:state.mode,off:state.off,moff:state.moff})}
let activeQuoteKey=quoteKeyForState();
const save=()=>{S.tab=tab;const nextKey=quoteKeyForState();if(nextKey!==activeQuoteKey){activeQuoteKey=nextKey;liveQuote=null;liveQuoteKey='';offlineSnapshot=null;offlineSnapshotKey='';quoteErrorKey='';lastQuoteLink=''}try{localStorage.setItem('nf2',JSON.stringify(S))}catch(e){}};
async function withSaving(button,message,action){
  const target=button instanceof HTMLElement?button:null;
  if(target&&(target.disabled||savingActions.has(target)))return;
  const original=target?.innerHTML;
  if(target){savingActions.add(target);target.disabled=true;target.setAttribute('aria-busy','true');target.classList.add('is-saving');target.innerHTML=`<svg class="saving-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Salvando…</span>`}
  screenError='';successMessage='';clearTimeout(successTimer);
  try{
    await new Promise(resolve=>requestAnimationFrame(resolve));
    const startedAt=performance.now();
    await action();
    const remaining=Math.max(0,550-(performance.now()-startedAt));
    if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
    successMessage=message;view();successTimer=setTimeout(()=>{successMessage='';if(document.visibilityState==='visible')view()},4000)
  }
  catch(error){reportError(error)}
  finally{if(target){savingActions.delete(target);target.disabled=false;target.removeAttribute('aria-busy');target.classList.remove('is-saving');target.innerHTML=original}}
}
function successFeedback(){return successMessage?`<div class="feedback" role="status" aria-live="polite">${inlineIcon(checkCircleIcon)}<span>${esc(successMessage)}</span></div>`:''}
const fmtMoney=(value,currency=catalogSnapshot?.config?.currency||'BRL')=>new Intl.NumberFormat('pt-BR',{style:'currency',currency}).format(value);
const hasPrice=value=>value!==undefined&&value!==null&&value!==''&&Number.isFinite(Number(value));
const inlineIcon=svg=>svg.replace('<svg ','<svg class="icon" ');
const themeIcon=dark=>inlineIcon(dark?sunIcon:moonIcon);
$('#sync').innerHTML=inlineIcon(syncIcon);
$('#admin').innerHTML=inlineIcon(adminIcon);

const sector=it=>it.cat==='supl'?'Suplementos':it.cat==='prot'?'Açougue':it.cat==='ovo'||/queijo|mussarela|iogurte|leite/i.test(it.name)?'Laticínios e ovos':/p[aã]o/i.test(it.name)?'Padaria':it.cat==='tub'||/banana|ma[cç][aã]|pera|manga|mam[aã]o|abacaxi|tangerina|laranja|lim[aã]o|kiwi|cenoura|beterraba|vagem|br[oó]colis|couve|chuchu|abobrinha|tomate|pepino/i.test(it.name)?'Hortifrúti':'Mercearia';
function plan(){
  const key=quoteKeyForState();
  const quote=liveQuoteKey===key
    ?{...liveQuote,offline:!navigator.onLine}
    :offlineSnapshotKey===key
      ?offlineSnapshot
      :calculateCommercialQuote(P,S,catalogSnapshot||{foods:[],aliases:[],config:null,pricesProtected:true,unavailable:true});
  const lines=quote.lines.map(line=>({...line,cat:line.category,mode:line.baseUnit==='unit'?'n':line.baseUnit,q:line.rawAmount,c:line.prescribedAmount,buy:line.purchaseAmount,p:line.unitPrice,cost:line.cost,sec:sector({name:line.name,cat:line.category})}));
  const out=quote.meals.map(meal=>({m:meal,isM:meal.isMarmita,list:meal.selections}));

}
const esc=s=>String(s??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function reportError(error){screenError=error instanceof Error?error.message:String(error);view()}
function quoteFromSnapshot(snapshot){
  return{...snapshot,meals:snapshot.selectedMeals,offline:true,syncedAt:snapshot.syncedAt||snapshot.createdAt};
}
function loadOfflineQuote(key){
  if(offlineLookupKey===key||offlineSnapshotKey===key)return;
  offlineLookupKey=key;
  getCachedQuoteSnapshot(key).then(snapshot=>{
    if(key!==quoteKeyForState()||navigator.onLine)return;
    if(snapshot){offlineSnapshot=quoteFromSnapshot(snapshot);offlineSnapshotKey=key;view()}
  }).catch(reportError).finally(()=>{if(offlineLookupKey===key)offlineLookupKey=''});
}
function ensureOnlineQuote(){
  const key=quoteKeyForState();
  if(tab!==3)return;

  if(!supabaseConfigured||liveQuoteKey===key||quoteRequestInFlight===key||quoteErrorKey===key)return;
  quoteRequestInFlight=key;
  requestCommercialQuote(P,S).then(quote=>{
    if(key!==quoteKeyForState())return;
    liveQuote=quote;liveQuoteKey=key;quoteErrorKey='';screenError='';view();
  }).catch(error=>{
    if(key===quoteKeyForState()){quoteErrorKey=key;reportError(error)}
  }).finally(()=>{if(quoteRequestInFlight===key)quoteRequestInFlight=''});
}
function renderAdmin(){

function appendCaptureFood(){
  captureText=$('#tx')?.value??captureText;
  const selected=$('#capture-meal')?.value,newMeal=$('#capture-new-meal')?.value.trim(),food=$('#capture-food')?.value.trim(),quantity=Number(String($('#capture-quantity')?.value||'').replace(',','.')),unit=$('#capture-unit')?.value;
  if(!food||!Number.isFinite(quantity)||quantity<=0){planError='Informe o alimento e uma quantidade maior que zero.';view();return}
  const meal=selected==='new'?newMeal:selected;
  if(!meal){planError='Informe o nome da nova refeição.';view();return}
  const hasMeal=captureText.split('\n').some(row=>row.trim().replace(/^#\s*/,'').split('|')[0].trim().toLocaleLowerCase('pt-BR')===meal.toLocaleLowerCase('pt-BR'));
  const line=`${String(quantity).replace('.',',')} ${unit} ${food}`;
  captureText=`${captureText.trim()}${hasMeal?'':'\n# '+meal}\n${line}`.trim();
  capturePreview=null;planError='';view();
}

function setBudget(value){
  const parsed=String(value).trim()===''?0:Number(String(value).replace(',','.'));

async function syncCatalog(){
  if(isSyncing)return;
  isSyncing=true;screenError='';quoteErrorKey='';net();view();
  let timer;
  try{
    const run=(async()=>{
      catalogSnapshot=await synchronizeCatalog();
      liveQuote=null;liveQuoteKey='';quoteErrorKey='';
      await flushLocalFoodRequests();
      if(adminSession)await refreshAdmin();
    })();
    run.catch(()=>{});
    await Promise.race([run,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('A sincronização demorou demais. Verifique a conexão e tente novamente.')),20000)})]);
  }
  catch(error){reportError(error)}
  finally{clearTimeout(timer);isSyncing=false;net();view()}
}
async function flushLocalFoodRequests(){
  const pending=await getPendingFoods();
  if(!pending.length)return;
  await submitFoodValidationRequests(pending);
  for(const food of pending)await deletePendingFood(food.normalizedName);
}
async function refreshAdmin(){
  const [data,pending,quotes]=await Promise.all([loadAdminData(),getPendingFoods(),getQuoteSnapshots()]);
  adminData=data;adminPending=pending;adminRequests=data.requests;quoteHistory=quotes;
}
async function openAdmin(){
  tab=4;screenError='';save();view();
  try{adminSession=await getAdminSession();if(adminSession)await refreshAdmin();view()}
  catch(error){reportError(error)}
}
async function adminLogin(){
  screenError='';adminAuthMessage='';
  try{adminSession=await signInAdmin($('#admin-email').value.trim(),$('#admin-password').value);adminAuthMode='login';await refreshAdmin();view()}
  catch(error){reportError(error)}
}
async function adminSendPasswordReset(){
  screenError='';adminAuthMessage='';
  const email=$('#admin-email').value.trim();
  if(!email){reportError(new Error('Informe seu e-mail para solicitar a redefinição de senha.'));return}
  try{
    await requestAdminPasswordReset(email);
    adminAuthMessage='Se houver uma conta para esse e-mail, você receberá instruções para redefinir a senha.';
    view();
  }catch(error){reportError(error)}
}
async function adminSaveRecoveryPassword(button){
  const password=$('#admin-new-password').value;
  if(password!==$('#admin-confirm-password').value){reportError(new Error('As senhas não coincidem.'));return}
  return withSaving(button,'Senha atualizada com sucesso.',async()=>{
    await updateAdminPassword(password);
    adminSession=await getAdminSession();
    if(!adminSession)throw new Error('A sessão de recuperação expirou. Solicite um novo link para redefinir a senha.');
    adminAuthMode='login';adminAuthMessage='';
    await refreshAdmin();
  });
}
async function adminLogout(){
  try{await signOutAdmin();adminSession=null;adminData=null;adminFoodEdit=null;newFoodDraft=null;screenError='';view()}
  catch(error){reportError(error)}
}
async function saveConfigFromForm(button){
  const config=adminData?.config;
  if(!config?.id){reportError(new Error('A configuração comercial ativa não foi encontrada.'));return}
  return withSaving(button,'Configurações salvas.',async()=>{
    await saveAdminConfig({id:config.id,business_name:$('#cfg-business-name').value,currency:$('#cfg-currency').value,show_food_prices:$('#cfg-show-prices').checked,packaging_cost_per_meal:$('#cfg-packaging').value,labor_cost_per_meal:$('#cfg-labor').value,overhead_cost_per_meal:$('#cfg-overhead').value,markup_percent:$('#cfg-markup').value,app_fee_percent:$('#cfg-fee').value});
    await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey='';
  });
}
function foodFormValues(status=$('#food-status').value){
  return{id:adminFoodEdit||undefined,canonical_name:$('#food-name').value,category:$('#food-category').value,base_unit:$('#food-unit').value,purchase_unit_label:$('#food-purchase-unit').value,purchase_increment:$('#food-increment').value,price_per_purchase_unit:$('#food-price').value,cooking_factor:$('#food-factor').value,approval_status:status};
}
async function saveFoodFromForm(button){
  const food=foodFormValues();
  if(food.approval_status==='approved'&&!hasPrice(food.price_per_purchase_unit)){reportError(new Error('Informe um preço válido antes de aprovar o alimento.'));return}
  return withSaving(button,adminFoodEdit?'Alimento atualizado.':'Alimento cadastrado.',async()=>{
    const pendingName=newFoodDraft?.normalizedName;
    const requestId=newFoodDraft?.requestId;
    const savedFood=await saveAdminFood(food);
    if(requestId)await resolveFoodValidationRequest(requestId,food.approval_status,savedFood.id);
    if(pendingName)await deletePendingFood(pendingName);
    adminFoodEdit=null;newFoodDraft=null;await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey='';
  });
}
function editAdminFood(id){adminFoodEdit=id;newFoodDraft=null;screenError='';view()}
function cancelFoodEdit(){adminFoodEdit=null;newFoodDraft=null;view()}
async function setFoodStatus(id,status,button){
  const food=adminData?.foods.find(item=>item.id===id);
  if(!food)return;
  if(status==='approved'&&!hasPrice(food.price_per_purchase_unit)){reportError(new Error('Edite o alimento e informe um preço válido antes de aprová-lo.'));return}
  return withSaving(button,status==='approved'?'Alimento aprovado.':'Status do alimento atualizado.',async()=>{
    await saveAdminFood({...food,approval_status:status});
    const request=adminRequests.find(item=>item.resolved_food_id===id);
    if(request)await resolveFoodValidationRequest(request.id,status,id);
    await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey='';
  });
}
async function deleteFood(id){
  if(!confirm('Excluir este alimento e seus sinônimos?'))return;
  try{await deleteAdminFood(id);await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey='';adminFoodEdit=null;screenError='';view()}
  catch(error){reportError(error)}
}
async function saveAliasFromForm(button){
  return withSaving(button,'Sinônimo adicionado.',async()=>{await saveAdminAlias({foodId:$('#alias-food').value,alias:$('#alias-name').value});await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey=''});
}
async function deleteAlias(id){
  try{await deleteAdminAlias(id);await refreshAdmin();catalogSnapshot=await synchronizeCatalog();liveQuote=null;liveQuoteKey='';screenError='';view()}
  catch(error){reportError(error)}
}
function startPendingFood(normalizedName){
  const pending=adminPending.find(item=>item.normalizedName===normalizedName);
  if(!pending)return;
  if(pending.foodId&&adminData?.foods.some(food=>food.id===pending.foodId)){
    adminFoodEdit=pending.foodId;newFoodDraft=null;view();return;
  }
  adminFoodEdit=null;
  newFoodDraft={normalizedName,canonical_name:pending.name,category:pending.category,base_unit:pending.baseUnit,purchase_unit_label:pending.baseUnit==='g'?'kg':pending.baseUnit==='ml'?'l':'un',purchase_increment:pending.baseUnit==='unit'?1:1000,price_per_purchase_unit:'',cooking_factor:pending.category==='prot'?.75:pending.category==='arroz'?2.5:pending.category==='feijao'?2.8:pending.category==='mac'?2.2:1,approval_status:'pending'};
  view();
}
function startRemoteFoodRequest(requestId){
  const request=adminRequests.find(item=>item.id===requestId);
  if(!request)return;
  const existing=adminData?.foods.find(food=>food.id===request.resolved_food_id);
  if(existing){editAdminFood(existing.id);return}
  adminFoodEdit=null;
  newFoodDraft={
    requestId:request.id,
    canonical_name:request.food_name,
    category:request.category,
    base_unit:request.base_unit,
    purchase_unit_label:request.base_unit==='g'?'kg':request.base_unit==='ml'?'l':'un',
    purchase_increment:request.base_unit==='unit'?1:1000,
    price_per_purchase_unit:'',
    cooking_factor:request.category==='prot'?.75:request.category==='arroz'?2.5:request.category==='feijao'?2.8:request.category==='mac'?2.2:1,
    approval_status:'pending',
  };
  view();
}
async function createAndShareQuote(button){
  return withSaving(button,'Orçamento salvo. Você já pode abrir o WhatsApp.',async()=>{
    const quote=plan().quote,snapshot=createQuoteSnapshot(quote,S,S.customerName);
    for(const pending of quote.pendingFoods)await savePendingFood({...pending,normalizedName:sanitizeFoodName(pending.name),createdAt:new Date().toISOString()});
    await saveQuoteSnapshot(snapshot);lastQuoteLink=formatWhatsAppQuote(snapshot);screenError='';
    if(navigator.onLine&&quote.pendingFoods.length){
      try{
        await submitFoodValidationRequests(quote.pendingFoods);
        for(const pending of quote.pendingFoods)await deletePendingFood(sanitizeFoodName(pending.name));
      }catch(error){screenError=error instanceof Error?error.message:String(error)}
    }
    if(adminSession)await refreshAdmin();
  });
}

$('#m').addEventListener('input',event=>{if(event.target.id==='cycle-budget')setBudget(event.target.value);if(event.target.id==='tx'){captureText=event.target.value;capturePreview=null}});

  adminAuthMessage='';

    adminSession=null;adminAuthMode='recovery';screenError='';
  }else{
    adminAuthMode='login';
    screenError='O link de recuperação não pertence a uma conta administradora. Verifique o e-mail ou solicite um novo link.';

getAdminSession().then(async session=>{adminSession=session;if(session)await refreshAdmin();view()}).catch(reportError);
function net(){
  const indicator=$('#net');
  if(!navigator.onLine){
    indicator.textContent=catalogSnapshot?.syncedAt
      ?`Offline · catálogo de ${new Date(catalogSnapshot.syncedAt).toLocaleString('pt-BR')} · confirme disponibilidade`
      :'Offline · sincronize para consultar preços';
    return;
  }
  indicator.textContent=isSyncing?'Sincronizando catálogo…':'';
}

view();
